name: Build Plutonium

on: [ "push", "pull_request" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        
      - name: Compile Plutonium
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: msbuild . /t:Build /p:Configuration=Release

      - name: Upload Compiled Plutonium DLL
        uses: actions/upload-artifact@v4
        with:
          name: Plutonium
          path: |
            ./x64/Release/Plutonium.dll
            ./x64/Release/Plutonium.pdb
          if-no-files-found: warn
          retention-days: 90

      - name: Upload Compiled PlutoniumClient DLL
        uses: actions/upload-artifact@v4
        with:
          name: PlutoniumClient
          path: |
            ./x64/Release/PlutoniumClient.dll
            ./x64/Release/PlutoniumClient.pdb
          if-no-files-found: warn
          retention-days: 90